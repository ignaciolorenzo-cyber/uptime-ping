name: supabase-alquileres-keepalive
# Supabase pausa los proyectos del plan gratis tras 7 días sin actividad.
# Esta consulta diaria mantiene despierta la base de la app de Alquileres.
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: consultar la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS --max-time 60 -o /tmp/out.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "La base no respondió como se esperaba:"; cat /tmp/out.txt; exit 1
          fi
          echo "Base despierta: $(cat /tmp/out.txt)"
